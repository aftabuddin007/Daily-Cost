<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Expense Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toastContainer"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ edit transaction</h3>
    <div class="modal-form">
      <div class="input-group">
        <label>title</label>
        <input type="text" id="editTitle" class="input-field">
      </div>

      <div class="input-group">
        <label>amount ($)</label>
        <input type="number" id="editAmount" class="input-field">
      </div>

      <div class="input-group">
        <label>date</label>
        <input type="date" id="editDate" class="input-field">
      </div>

      <div class="input-group">
        <label>category</label>
        <div class="cat-row" id="editCatRow"></div>
      </div>

      <div class="modal-actions">
        <button class="btn" id="editCancelBtn">cancel</button>
        <button class="btn btn-primary" id="editSaveBtn">save</button>
      </div>
    </div>
  </div>
</div>

<!-- Budget Modal -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal">
    <h3>🎯 Set Budget</h3>
    <div class="modal-form">
      <div class="input-group">
        <label>Daily Budget</label>
        <input type="number" id="budgetInput" class="input-field">
      </div>

      <div class="modal-actions">
        <button class="btn" id="budgetCancelBtn">cancel</button>
        <button class="btn btn-primary" id="budgetSaveBtn">save</button>
      </div>
    </div>
  </div>
</div>

<div class="dashboard">

  <!-- HEADER -->
  <div class="card header-card">
    <h1>flow <span class="accent">expense</span></h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="transactions">Transactions</button>
      <button class="tab-btn" data-tab="add">Add New</button>
      <button class="tab-btn" data-tab="analytics">Analytics</button>
    </div>
  </div>

  <!-- ADD TAB -->
  <div class="card tab-section" id="tab-add">
    <div class="cat-row" id="addCatRow"></div>

    <input type="text" id="titleInput" class="input-field" placeholder="Title">
    <input type="number" id="amountInput" class="input-field" placeholder="Amount">
    <input type="date" id="dateInput" class="input-field">

    <button id="addBtn" class="btn btn-primary btn-full">Add Transaction</button>
  </div>

  <!-- TRANSACTION TAB -->
  <div class="card tab-section visible" id="tab-transactions">
    <button id="setBudgetBtn" class="btn">Set Budget</button>
    <button id="clearBudgetBtn" class="btn">Clear Budget</button>

    <div id="expenseListContainer"></div>

    <div class="total-row">
      <span>Total</span>
      <span id="totalDisplay">$0.00</span>
    </div>
  </div>

  <!-- ANALYTICS -->
  <div class="card tab-section" id="tab-analytics">
    <h3>Analytics</h3>
    <div id="weeklyChart"></div>
    <div id="catBreakdown"></div>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
